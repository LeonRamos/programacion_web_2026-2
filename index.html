<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta Gamer ID</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .gamer-card {
      width: 360px;
      height: 220px;
      background: linear-gradient(135deg, #1f1e2e 0%, #0b0b12 100%);
      border-radius: 12px;
      border: 1px solid #7928ca;
      box-shadow: 0 0 15px rgba(121, 40, 202, 0.35);
      padding: 16px;
      color: #ffffff;
      position: relative;
      overflow: hidden;
    }

    /* Fondo decorativo */
    .gamer-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 225, 255, 0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .community-name {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #00e1ff;
      text-transform: uppercase;
    }

    .card-type {
      font-size: 0.65rem;
      background: #7928ca;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .card-body {
      display: flex;
      gap: 16px;
    }

    .avatar-container {
      position: relative;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      border: 2px solid #00e1ff;
      object-fit: cover;
      background-color: #151520;
    }

    .user-level {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      background: #00e1ff;
      color: #0b0c10;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .user-info {
      flex: 1;
    }

    .gamertag {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
    }

    .real-name {
      font-size: 0.75rem;
      color: #8a8a9e;
      margin-bottom: 10px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .info-item span {
      display: block;
      color: #606075;
      font-size: 0.58rem;
      text-transform: uppercase;
      font-weight: 700;
    }

    .info-item p {
      font-size: 0.72rem;
      font-weight: 600;
      color: #d0d0e0;
    }

    .card-footer {
      position: absolute;
      bottom: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      color: #505065;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 8px;
    }

    .member-id {
      font-family: monospace;
      color: #00e1ff;
      font-weight: bold;
    }

    .status-active {
      color: #00ff88;
      font-weight: bold;
    }
  </style>

</head>
<body>

  <div class="gamer-card">
    <div class="card-header">
      <span class="community-name">CyberNet Clan</span>
      <span class="card-type">ID Oficial</span>
    </div>

    <div class="card-body">
      <div class="avatar-container">
        <img src="https://via.placeholder.com/80" alt="Avatar Gamer" class="avatar">
        <span class="user-level">NVL 60</span>
      </div>

      <div class="user-info">
        <div class="gamertag">Vortex_Rider</div>
        <div class="real-name">Carlos Mendoza</div>

        <div class="info-grid">
          <div class="info-item">
            <span>Rango</span>
            <p>Leyenda</p>
          </div>
          <div class="info-item">
            <span>Plataforma</span>
            <p>PC / Steam</p>
          </div>
          <div class="info-item">
            <span>Rol principal</span>
            <p>Fragger / DPS</p>
          </div>
          <div class="info-item">
            <span>Miembro desde</span>
            <p>2023</p>
          </div>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <span>ID: <strong class="member-id">#CN-9942-2026</strong></span>
      <span class="status-active">● ACTIVO</span>
    </div>
  </div>

</body>
</html>
